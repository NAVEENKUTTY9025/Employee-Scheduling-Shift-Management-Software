<!DOCTYPE html>
<html lang="en" class="overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign Up | ShiftEase</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000000'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23E5A000' font-family='Arial' font-weight='bold'%3E⏱%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'shift-black': '#000000',
                        'shift-white': '#FFFFFF',
                        'shift-gold': '#E5A000',
                        'shift-gold-dark': '#C78A00',
                        'shift-gold-light': '#F5C542',
                        'shift-gray': '#1A1A1A',
                        'shift-gray-light': '#2A2A2A',
                    }
                }
            }
        }
    </script>
    <style>
        /* ===== BASE & NO SCROLL ===== */
        * { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; }
        
        /* Hide scrollbar for all browsers */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* ===== INPUT FIELDS ===== */
        .form-input {
            width: 100%;
            background: #F9F9F9;
            border: 1.5px solid #E8E8E8;
            border-radius: 12px;
            padding: 14px 16px 14px 44px; /* Padding for icon */
            font-size: 0.95rem;
            transition: all 0.3s;
            color: #000000;
        }
        .dark .form-input {
            background: #1A1A1A;
            border-color: #2A2A2A;
            color: #FFFFFF;
        }
        .form-input:focus {
            outline: none;
            border-color: #E5A000;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(229, 160, 0, 0.1);
        }
        .dark .form-input:focus {
            background: #0A0A0A;
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            background: #E5A000;
            color: #000000;
            padding: 0.85rem 2rem;
            border-radius: 12px;
            font-weight: 800;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.95rem;
            width: 100%;
        }
        .btn-primary:hover {
            background: #F5C542;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(229,160,0,0.35);
        }

        .social-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1.5px solid #E8E8E8;
            background: transparent;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            color: #000;
        }
        .dark .social-login-btn {
            border-color: #2A2A2A;
            color: #FFF;
        }
        .social-login-btn:hover {
            background: #F9F9F9;
            border-color: #D1D1D1;
        }
        .dark .social-login-btn:hover {
            background: #1A1A1A;
            border-color: #444;
        }

        /* Navbar icon buttons */
        .btn-icon-rounded {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #FFF;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
        }
        .btn-icon-rounded:hover {
            background: #E5A000;
            color: #000000;
            border-color: #E5A000;
        }

        .logo-icon {
            background: #000000;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #E5A000;
            flex-shrink: 0;
        }
        .logo-icon i { color: #E5A000; font-size: 1.15rem; }
        .logo-text {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #FFFFFF;
            line-height: 1.1;
        }
        .logo-text .highlight { color: #E5A000; }
        .logo-sub {
            font-size: 0.45rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.65);
            font-weight: 700;
            display: block;
            margin-top: -1px;
        }

        @media (max-width: 768px) {
            .logo-icon { width: 36px; height: 36px; border-radius: 11px; }
            .logo-icon i { font-size: 1.1rem; }
            .logo-text { font-size: 1.25rem; }
            .logo-sub { font-size: 0.45rem; color: rgba(255, 255, 255, 0.65); display: block; }
            .btn-icon-rounded { width: 32px; height: 32px; font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .logo-icon { width: 36px; height: 36px; border-radius: 11px; }
            .logo-icon i { font-size: 1.1rem; }
            .logo-text { font-size: 1.25rem; }
            .logo-sub { font-size: 0.45rem; color: rgba(255, 255, 255, 0.65); display: block; }
        }
    </style>
</head>
<body class="bg-shift-black text-gray-900 dark:text-gray-100 transition-colors duration-300 font-sans h-screen w-full overflow-hidden flex flex-col relative">

    <!-- Background Image Layer (Absolute positioned behind everything) -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2069&auto=format&fit=crop" alt="Modern Office" class="w-full h-full object-cover opacity-20">
        <div class="absolute inset-0 bg-gradient-to-br from-black/90 via-black/80 to-black/95"></div>
        <!-- Subtle Gold Glow -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-shift-gold/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- ===== TOP HEADER (Logo Left, Toggles Right) ===== -->
    <header class="absolute top-0 left-0 w-full z-20 flex justify-between items-center p-6 md:p-8">
        <!-- Logo (Navigates to index.html) -->
        <a href="index.html" class="flex items-center gap-3 text-decoration-none group">
            <div class="logo-icon group-hover:scale-105 transition-transform">
                <i class="fas fa-clock"></i>
            </div>
            <div>
                <span class="logo-text">Shift<span class="highlight">Ease</span></span>
                <span class="logo-sub">SCHEDULING PLATFORM</span>
            </div>
        </a>

        <!-- Toggles (Right Side Top Corner) -->
        <div class="flex items-center gap-3">
            <button id="rtl-toggle" class="btn-icon-rounded" title="Toggle RTL">&#8644;</button>
            <button id="theme-toggle" class="btn-icon-rounded" title="Toggle Theme">
                <i class="fas fa-moon"></i>
                <i class="fas fa-sun hidden"></i>
            </button>
        </div>
    </header>

    <!-- ===== CENTERED SIGNUP FORM ===== -->
    <main class="relative z-10 flex-grow flex items-center justify-center w-full h-full px-4">
        
        <!-- Signup Container -->
        <div class="w-full max-w-[440px] bg-white dark:bg-shift-gray/90 backdrop-blur-xl border border-gray-200 dark:border-white/10 rounded-3xl p-8 md:p-10 shadow-2xl">
            
            <!-- Heading -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2 tracking-tight">Create an account</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm">Start your 14-day free trial. No credit card required.</p>
            </div>

            <!-- Social Login Buttons -->
            <div class="grid grid-cols-3 gap-3 mb-6">
                <!-- Google (Official Logo) -->
                <button class="social-login-btn px-2" title="Sign up with Google">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </button>
                <!-- Facebook (Official Logo) -->
                <button class="social-login-btn px-2" title="Sign up with Facebook">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/>
                    </svg>
                </button>
                <!-- Apple (Official Logo) -->
                <button class="social-login-btn px-2" title="Sign up with Apple">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 3.5c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.61 1.34-.55.63-1.03 1.66-.9 2.68 1 .08 2.02-.49 2.59-1.17z"/>
                    </svg>
                </button>
            </div>

            <!-- Divider -->
            <div class="flex items-center gap-3 mb-6">
                <div class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></div>
                <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Or sign up with email</span>
                <div class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></div>
            </div>

            <!-- Signup Form -->
            <form action="#" method="POST" class="space-y-4">
                
                <!-- Full Name -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="fullName" placeholder="Full Name" class="form-input" required>
                </div>

                <!-- Email -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" id="email" placeholder="Work Email" class="form-input" required>
                </div>

                <!-- Password -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" placeholder="Password" class="form-input" required>
                    <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-shift-gold">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <!-- Terms -->
                <div class="flex items-start gap-2 pt-1 pb-2">
                    <input type="checkbox" id="terms" class="mt-1 w-4 h-4 rounded border-gray-300 text-shift-gold focus:ring-shift-gold bg-gray-50 dark:bg-shift-black cursor-pointer" required>
                    <label for="terms" class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed cursor-pointer">
                        I agree to the <a href="#" class="text-shift-gold hover:underline">Terms of Service</a> and <a href="#" class="text-shift-gold hover:underline">Privacy Policy</a>.
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary">
                    Create Account <i class="fas fa-arrow-right ml-1 text-sm"></i>
                </button>
            </form>

            <!-- Login Link -->
            <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-6">
                Already have an account? <a href="login.html" class="text-shift-gold font-bold hover:underline">Log in</a>
            </p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ===== THEME TOGGLE =====
            const themeBtn = document.getElementById('theme-toggle');
            const updateThemeUI = (dark) => {
                if (themeBtn) {
                    const moon = themeBtn.querySelector('.fa-moon');
                    const sun = themeBtn.querySelector('.fa-sun');
                    if (dark) {
                        moon?.classList.add('hidden');
                        sun?.classList.remove('hidden');
                    } else {
                        moon?.classList.remove('hidden');
                        sun?.classList.add('hidden');
                    }
                }
            };
            const toggleTheme = () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeUI(isDark);
            };
            if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            }

            // ===== RTL TOGGLE =====
            const rtlBtn = document.getElementById('rtl-toggle');
            const updateRtlUI = (isRtl) => {
                document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
                if (rtlBtn) rtlBtn.classList.toggle('active', isRtl);
            };
            const toggleRtl = () => {
                const isRtl = document.documentElement.dir !== 'rtl';
                localStorage.setItem('dir', isRtl ? 'rtl' : 'ltr');
                updateRtlUI(isRtl);
            };
            if (rtlBtn) rtlBtn.addEventListener('click', toggleRtl);
            if (localStorage.getItem('dir') === 'rtl') updateRtlUI(true);
        });
    </script>
</body>
</html>
